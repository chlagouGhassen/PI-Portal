# Stack docker complète pour PI Portal.
#
# Services :
#   - postgres : DB applicative + métier
#   - backend  : Express + Python (pbixray, sklearn, statsmodels)
#   - frontend : nginx servant le bundle Vite + proxy /api/ vers backend
#
# Démarrage :
#   docker compose up -d --build
#   open http://localhost:8080
#
# Override du port frontend (ex. pour publier sur :80 en prod sans conflit) :
#   FRONTEND_PORT=80 docker compose up -d
#
# Premier démarrage : `prisma migrate deploy` lance les migrations automatiquement.
# Le seed n'est PAS auto — `docker compose exec backend npm run seed` pour
# créer les comptes par défaut.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pi-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pi_portal
      POSTGRES_PASSWORD: pi_portal_dev
      POSTGRES_DB: pi_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_portal -d pi_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pi-portal-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pi_portal:pi_portal_dev@postgres:5432/pi_portal?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string-min-32}
      PORT: 4000
      # Par défaut development pour un docker compose local (sans HTTPS).
      # En prod (Render, Fly, etc.) : override avec NODE_ENV=production +
      # JWT_SECRET 64+ chars + COOKIE_SECURE=true + CORS_ORIGIN HTTPS.
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # nginx proxie, on lui fait confiance (1 hop). Sans ça, le rate-limit
      # voit l'IP du conteneur frontend, pas celle du client.
      TRUST_PROXY: 1
      PYTHON_BIN: /app/.venv/bin/python
      BOURSE_DATA_DIR: /app/data/bourse
    volumes:
      # Bind mount du dossier data/ du host → conteneur.
      # Permet : (a) le .pbix initial est visible, (b) les uploads bourse
      # persistent sur le host, (c) inspection facile pendant le dev.
      - ./data:/app/data
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pi-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Bind sur 8080 host -> 80 container : évite les conflits avec d'autres
    # services qui squattent le 80 (nginx host, IIS Windows en WSL2, etc.).
    # Pour publier sur :80 en prod, override avec FRONTEND_PORT=80.
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
