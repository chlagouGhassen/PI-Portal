# nginx config pour le frontend Vite + proxy backend.
# SPA fallback (React Router) + proxy /api/ vers le service backend du compose.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — réduit ~70% le payload (JS bundles + CSS)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Assets fingerprintés par Vite (filename.HASH.ext) → cache éternel.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon + autres assets de la racine — cache modéré.
    location ~* \.(svg|png|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy API → backend. Le browser ne fait que du same-origin (port 80),
    # ce qui simplifie tout (cookies, CORS, dev/prod parity).
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 110 MB pour absorber les uploads .pbix (limite multer 100 MB + overhead)
        client_max_body_size 110m;

        # Timeouts généreux pour les pipelines ML (predict_timeseries SARIMA ~30s)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA fallback : toute route non-fichier renvoie index.html → React Router prend la main.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
